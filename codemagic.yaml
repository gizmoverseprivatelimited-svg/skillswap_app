workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          if [ -d "ios" ]; then
            cd ios && pod install
          elif [ -f "app.json" ]; then
            npx expo prebuild --platform ios
            cd ios && pod install
          else
            echo "Error: ios directory not found in root"
            exit 1
          fi
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa --workspace ios/*.xcworkspace --scheme Leteski
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
