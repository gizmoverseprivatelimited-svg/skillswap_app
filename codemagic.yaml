workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      node: 18
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.gizmoverseprivatelimited.leteski"
        XCODE_PROJECT: "ios/Leteski.xcworkspace"
        XCODE_SCHEME: "Leteski"
    scripts:
      - name: Clean install & generate iOS folder
        script: |
          npm install
          npx expo prebuild --platform ios --clean
      - name: Robust Podfile Patching
        script: |
          node -e '
            const fs = require("fs");
            const file = "ios/Podfile";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("use_modular_headers!")) {
                content = "use_modular_headers!\n" + content;
                fs.writeFileSync(file, content, "utf8");
                console.log("Successfully injected use_modular_headers!");
              }
            }
          '
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build IPA using xcodebuild
        script: |
          cd ios
          # Automatically find your Team ID from App Store Connect API Key & configure signing
          xcodebuild -workspace Leteski.xcworkspace \
            -scheme Leteski \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            clean archive -archivePath build/Leteski.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=""
          
          xcodebuild -exportArchive \
            -archivePath build/Leteski.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist <(echo '{"method": "app-store", "signingStyle": "automatic"}')
    artifacts:
      - ios/build/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
