workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      node: 18
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
    scripts:
      - name: Install dependencies & generate iOS folder
        script: |
          npm install
          npx expo prebuild --platform ios --clean
      - name: Patch Podfile for modular headers
        script: |
          if [ -f "ios/Podfile" ]; then
            sed -i '' '1i use_modular_headers!' ios/Podfile
          fi
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/*.xcworkspace --scheme Leteski
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
