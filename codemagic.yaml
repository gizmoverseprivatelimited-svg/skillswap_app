workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      node: 18
      xcode: latest
      cocoapods: default
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "com.gizmoverseprivatelimited.leteski"
    scripts:
      - name: Clean install & generate iOS folder
        script: |
          npm install
          npx expo prebuild --platform ios --clean
      - name: Robust Podfile Patching
        script: |
          node -e '
            const fs = require("fs");
            const file = "ios/Podfile";
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, "utf8");
              if (!content.includes("use_modular_headers!")) {
                content = "use_modular_headers!\n" + content;
                fs.writeFileSync(file, content, "utf8");
                console.log("Successfully injected use_modular_headers!");
              }
            }
          '
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing
        script: |
          # Codemagic automatic profile setup using API Key
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa --workspace ios/*.xcworkspace --scheme Leteski
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: false
